<!doctype html>
<!-- كان lang="en" مكتوباً هنا رغم أن اللغة الافتراضية عربية، ولم يُصحَّح إلا
     بعد إقلاع جافاسكربت — أي بعد أن يكون الزاحف وقارئ الشاشة قد قرآ الخطأ. -->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo_carHero.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#8f5cb1" />
    <meta name="description" content="Car Hero — منصة تربط السائقين بأقرب مزوّد متاح لخدمات الطوارئ على الطريق والصيانة المجدولة في سوريا." />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Car Hero" />
    <meta property="og:title" content="Car Hero — مساعدة الطريق تصل إليك أينما كنت" />
    <meta property="og:description" content="اطلب خدمة لسيارتك من موقعك، وسيصلك أقرب مزوّد متاح بسرعة." />
    <meta property="og:image" content="/logo_carHero.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- كان Poppins يُحمَّل هنا بأوزانه الستّة دائماً، حتى والواجهة عربية
         بالكامل ولا يظهر منه محرف واحد. صار يُحقَن عند التبديل للإنجليزية
         فقط — انظر RootProvider. -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- يضبط السمة قبل أول رسم لمنع وميض التبديل بين الوضعين -->
    <script>
      (function () {
        // الداكن هو الافتراضي: لا يُستشار تفضيل النظام، ولا يُقرَأ إلا
        // اختيار صريح سابق من الزائر عبر مبدّل السمة.
        var mode = 'dark';
        try {
          var stored = localStorage.getItem('theme');
          if (stored === 'light' || stored === 'dark') mode = stored;
        } catch (e) { /* التخزين المحلي محجوب — يبقى الافتراضي الداكن */ }
        document.documentElement.setAttribute('data-theme', mode);
        document.documentElement.classList.toggle('dark', mode === 'dark');
      })();
    </script>

    <title>Car Hero — مساعدة الطريق تصل إليك أينما كنت</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
